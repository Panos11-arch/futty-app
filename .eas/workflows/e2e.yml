# End-to-end user journeys with Maestro (docs/testing/maestro.md), on an
# iPhone simulator and an Android emulator, against the STAGING Supabase
# project with Stripe in TEST mode. Never production.
#
# Run by hand:  eas workflow:run .eas/workflows/e2e.yml
# Also runs on every pull request into master.
#
# Secrets: STAGING_SUPABASE_URL, STAGING_SUPABASE_SERVICE_ROLE_KEY,
# STAGING_STRIPE_SECRET_KEY and STAGING_E2E_PASSWORD are secret variables
# in the Expo project's "preview" environment. Every job that runs code
# here says environment: preview, so none of them ever loads production's
# variables (a custom job's default).

name: E2E (Maestro, staging)

on:
  workflow_dispatch: {}
  pull_request:
    branches: ['master']

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  # Stops everything while eas.json's e2e-test profile still has a
  # REPLACE_ placeholder, names production or holds a live Stripe key.
  check_config:
    name: Check the e2e-test profile
    environment: preview
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - name: No placeholders, no production, no live keys
        run: npx --yes tsx@4.20.6 scripts/e2e-seed/check-profile.ts

  # Resets and re-creates only e2e data on staging: the e2e logins, the
  # E2E Arena venue and its Stripe test account. Hands the slot to the
  # Maestro jobs. scripts/e2e-seed/seed.ts refuses production and live keys
  # before it connects to anything.
  seed:
    name: Seed staging
    needs: [check_config]
    environment: preview
    runs_on: linux-medium
    outputs:
      slot_day: ${{ steps.seed.outputs.slot_day }}
      ios_start: ${{ steps.seed.outputs.ios_start }}
      android_start: ${{ steps.seed.outputs.android_start }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - id: seed
        name: Reset and seed e2e data
        run: |
          set -euo pipefail
          E2E_SEED_OUTPUT=seed-output.json npx --yes tsx@4.20.6 scripts/e2e-seed/seed.ts
          set-output slot_day "$(node -p "require('./seed-output.json').slot_day")"
          set-output ios_start "$(node -p "require('./seed-output.json').ios_start")"
          set-output android_start "$(node -p "require('./seed-output.json').android_start")"

  build_ios:
    name: Build for the iPhone simulator
    needs: [check_config]
    type: build
    params:
      platform: ios
      profile: e2e-test

  build_android:
    name: Build the Android APK
    needs: [check_config]
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_ios:
    name: Maestro on an iPhone simulator
    needs: [build_ios, seed]
    type: maestro
    environment: preview
    runs_on: macos-medium
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: ['.maestro']
    env:
      MAESTRO_E2E_PLATFORM: ios
      MAESTRO_E2E_PASSWORD: ${{ env.STAGING_E2E_PASSWORD }}
      MAESTRO_E2E_DAY: ${{ needs.seed.outputs.slot_day }}
      MAESTRO_E2E_START: ${{ needs.seed.outputs.ios_start }}

  maestro_android:
    name: Maestro on an Android emulator
    needs: [build_android, seed]
    type: maestro
    environment: preview
    runs_on: linux-medium-nested-virtualization
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: ['.maestro']
    env:
      MAESTRO_E2E_PLATFORM: android
      MAESTRO_E2E_PASSWORD: ${{ env.STAGING_E2E_PASSWORD }}
      MAESTRO_E2E_DAY: ${{ needs.seed.outputs.slot_day }}
      MAESTRO_E2E_START: ${{ needs.seed.outputs.android_start }}
