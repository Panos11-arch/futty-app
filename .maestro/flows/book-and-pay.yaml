# Journey b: book E2E Arena for the seeded slot (its first free pitch, the
# whole pitch), the booker paying for everyone, pay with Stripe's test card, wait for the webhook to confirm the
# booking, and find it in My bookings.
#
# The amount is spec 13's worked example: a €60 5-a-side, the booker paying
# for everyone, is €60 + 10 x €0.55 = €65.50 ("Prices and fees").
# MAESTRO_E2E_DAY and MAESTRO_E2E_START come from the seed (the slot two
# days ahead in Cyprus; 1900 on iOS, 2000 on Android).
appId: com.panosalepis.futtyapp
name: book-and-pay
tags:
  - e2e
  - booking
env:
  PLATFORM: ${MAESTRO_E2E_PLATFORM}
  EMAIL: ${'e2e-' + MAESTRO_E2E_PLATFORM + '-1@e2e.futty.app'}
  PASSWORD: ${MAESTRO_E2E_PASSWORD}
  DAY: ${MAESTRO_E2E_DAY}
  START: ${MAESTRO_E2E_START.replace(':', '')}
  # Cyprus today: the seeded day less 2 (both are calendar dates, so UTC arithmetic is exact).
  TODAY: ${new Date(Date.parse(MAESTRO_E2E_DAY) - 2 * 86400000).toISOString().slice(0, 10)}
  VENUE_ID: e2e00000-0000-4000-8000-000000000001
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}

# ---- Book a pitch (S4): format, day, time, length, then the venue's time --
# Home → Book a pitch (S2: Book is no longer a tab).
- runFlow:
    file: ../subflows/open-tab.yaml
    env:
      TAB: home
- tapOn:
    id: tab-book
- extendedWaitUntil:
    visible:
      id: book-chip-format
    timeout: 30000
# Format: 5-a-side (the format sheet keeps book-format-<f>).
- tapOn:
    id: book-chip-format
- tapOn:
    id: book-format-5-a-side
# Day: the seeded day, alone (the calendar keeps book-day-<day>).
- tapOn:
    id: book-chip-date
- extendedWaitUntil:
    visible:
      id: book-day-${DAY}
    timeout: 10000
- tapOn:
    id: book-day-${DAY}
# The search opens on today (the seeded day is E2E_DAYS_AHEAD = 2 days after
# it, scripts/e2e-seed/slot.ts): take it off so only the seeded day is searched.
- tapOn:
    id: book-day-${TODAY}
- tapOn:
    id: book-days-see-results
# Time: Evening (18:00–24:00) holds the seeded start (19:00 on iOS, 20:00 on Android).
- tapOn:
    id: book-chip-time
- tapOn:
    id: book-time-preset-evening
- tapOn:
    id: book-time-see-results
# Length: 60 minutes (the Filter sheet keeps book-length-<m>).
- tapOn:
    id: book-chip-filters
- tapOn:
    id: book-length-60
- tapOn:
    id: book-filter-see-results
# The venue's card, then its seeded start time.
- scrollUntilVisible:
    element:
      id: free-venue-${VENUE_ID}
    direction: DOWN
    timeout: 30000
    centerElement: true
- scrollUntilVisible:
    element:
      id: book-venue-${VENUE_ID}-time-${DAY}-${START}
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: book-venue-${VENUE_ID}-time-${DAY}-${START}

# ---- The venue page's Book tab (S5): the slot is picked, the first free
# pitch preselected; Continue opens the payment sheet ----------------------
- extendedWaitUntil:
    visible:
      id: venue-book-pitch-1
    timeout: 30000
- runFlow: ../subflows/weather-settled.yaml
- tapOn:
    id: venue-book-pitch-1
- tapOn:
    id: venue-book
    enabled: true

# ---- The payment sheet (Booking v2): the whole pitch, the booker paying
# for everyone -----------------------------------------------------------------
- extendedWaitUntil:
    visible:
      id: checkout-kind-whole
    timeout: 30000
- tapOn:
    id: checkout-kind-whole
- scrollUntilVisible:
    element:
      id: checkout-who-pay-all
    direction: DOWN
- tapOn:
    id: checkout-who-pay-all
- scrollUntilVisible:
    element:
      id: checkout-pay
    direction: DOWN
- assertVisible:
    id: checkout-pay
    text: 'Pay €65\.50'
    enabled: true
- tapOn:
    id: checkout-pay
- runFlow:
    file: ../subflows/stripe-test-card.yaml
    env:
      PAY_LABEL: 'Pay €65\.50'
      PAY_AMOUNT: '65\.50'

# ---- The screen after paying (B3) ----------------------------------------
# Invite friends and publish are there. S20A (b): Invite all friends invites
# this platform's seeded friend (scripts/e2e-seed); then on to the booking.
- extendedWaitUntil:
    visible:
      id: after-pay-done
    timeout: 60000
- assertNotVisible:
    id: checkout-error
- scrollUntilVisible:
    element:
      id: after-pay-invite-all-friends
    direction: DOWN
    timeout: 10000
- tapOn:
    id: after-pay-invite-all-friends
- extendedWaitUntil:
    visible: '(Invited \d+ friends?\.|Nobody new to invite\.)'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: after-pay-done
    direction: DOWN
    timeout: 10000
- tapOn:
    id: after-pay-done

# ---- Confirmed by the webhook --------------------------------------------
# "Go to booking" opens the booking. Its status turns confirmed only when Stripe's
# webhook says the payment is held, so open it again from My bookings until
# it does: up to 6 tries, about 3 minutes.
- extendedWaitUntil:
    visible:
      id: 'booking-detail-status-.*'
    timeout: 60000
- assertNotVisible:
    id: checkout-error
- retry:
    maxRetries: 6
    commands:
      - runFlow: ../subflows/open-my-booking.yaml
      - extendedWaitUntil:
          visible:
            id: booking-detail-status-confirmed
          timeout: 15000
# Cancel sits below the first screen (under the players and the invite), and
# assertVisible doesn't scroll.
- runFlow: ../subflows/weather-settled.yaml
- scrollUntilVisible:
    element:
      id: booking-detail-cancel-whole-team
    direction: DOWN
    timeout: 20000
- takeScreenshot: book-and-pay-${PLATFORM}
