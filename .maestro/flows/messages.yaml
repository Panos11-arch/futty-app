# Journey (S13): Messages. Community and Account both open the inbox; the
# seeded e2e login has no chats yet, so the inbox shows its one-line empty
# state and its one button. Captain chats need two seeded league captains,
# and friend chats open with S20 (friends).
appId: com.panosalepis.futtyapp
name: messages
tags:
  - e2e
  - messages
env:
  PLATFORM: ${MAESTRO_E2E_PLATFORM}
  EMAIL: ${'e2e-' + MAESTRO_E2E_PLATFORM + '-1@e2e.futty.app'}
  PASSWORD: ${MAESTRO_E2E_PASSWORD}
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- assertVisible:
    id: home-screen

# ---- Community → Messages ---------------------------------------------------
- runFlow:
    file: ../subflows/open-tab.yaml
    env:
      TAB: community
- tapOn:
    id: community-messages
- assertVisible:
    id: messages-screen
- assertVisible: 'No messages yet.'
- takeScreenshot: messages-empty-${PLATFORM}
- back

# ---- Account → Messages -----------------------------------------------------
- tapOn:
    id: header-menu
- tapOn:
    id: account-messages
- assertVisible:
    id: messages-screen
- assertVisible: 'Open leagues'
- takeScreenshot: messages-${PLATFORM}
