# Pays in Stripe's own payment sheet with the test card 4242 4242 4242 4242,
# expiry 12/34, CVC 123 (Stripe test mode only). The sheet is Stripe's, so
# it has no testIDs of ours: it is driven by its own labels. PAY_LABEL is
# the sheet's button, e.g. 'Pay €65\.50' (a regular expression).
appId: com.panosalepis.futtyapp
---
# The sheet opens either on the card form or (Android) on a list of ways to
# pay (Card, Amazon Pay, Satispay); from the list, "Card" opens the form.
- extendedWaitUntil:
    visible: 'Card|.*Card number.*'
    timeout: 30000
- runFlow:
    when:
      visible: 'Card'
    commands:
      - tapOn: 'Card'
- extendedWaitUntil:
    visible: '.*Card number.*'
    timeout: 15000
- tapOn: '.*Card number.*'
# Focus moves on by itself once each field is complete.
- inputText: '4242424242424242'
- inputText: '1234'
- inputText: '123'
# A postal code shows only for some countries (the simulator's region).
- runFlow:
    when:
      visible: '.*(ZIP|Postal).*'
    commands:
      - tapOn: '.*(ZIP|Postal).*'
      - inputText: '10001'
# iOS's number pad has no key that closes it, so hideKeyboard fails there,
# and Maestro can't find iOS's Done over the pad. Stripe's iOS sheet ends
# editing on a tap anywhere that isn't a control, so tap its heading.
# Android closes the keyboard with Back.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Card information'
# Works with the keyboard up or down: the sheet scrolls its button into view.
# On Android it sits at the very bottom of the screen and never counts as
# 100% visible (the default), so half is enough.
- scrollUntilVisible:
    element:
      text: ${PAY_LABEL}
    direction: DOWN
    visibilityPercentage: 50
    timeout: 15000
# The checkout's own button reads the same and sits under the sheet; the
# sheet is on top, so the tap lands on Stripe's button.
- tapOn:
    text: ${PAY_LABEL}
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: '.*Card number.*'
    timeout: 60000
