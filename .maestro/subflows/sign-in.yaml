# Starts the app from nothing and signs in as EMAIL / PASSWORD, ending on
# Home. The seeded logins have a username, so no profile setup; the
# starting-level questions (offered once per device, and clearState makes a
# new device) are skipped if they show.
appId: com.panosalepis.futtyapp
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 60000
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
# The seed gives each login a level, so the questions shouldn't show; if
# they do, "Skip for now" sits under the answers and can be off screen on a
# small simulator, so scroll to it before tapping.
- extendedWaitUntil:
    visible:
      id: starting-level-form
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: starting-level-form
    commands:
      - scrollUntilVisible:
          element:
            id: starting-level-skip
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: starting-level-skip
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
