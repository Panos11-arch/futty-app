name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  app:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit

  edge-functions:
    name: Edge Functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=none supabase/functions/*/index.ts
      - run: deno test --node-modules-dir=none supabase/functions/

  database:
    name: SQL tests
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      # Starts Supabase's Postgres and applies supabase/migrations + seed.sql.
      - run: supabase db start
      - run: supabase/tests/run.sh
