name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  app:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit
      # Fails if lib/money/ (once it exists) drops below 100% line coverage.
      - run: npx jest --ci

  edge-functions:
    name: Edge Functions typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=none supabase/functions/*/index.ts
      - run: deno test --node-modules-dir=none --coverage=coverage/deno supabase/functions/
      - run: deno coverage --lcov --output=coverage/deno.lcov coverage/deno
      # Fails if any supabase/functions/_shared/money* file is below 100% line coverage.
      - run: deno run --allow-read supabase/functions/_scripts/check-money-coverage.ts coverage/deno.lcov

  database:
    name: SQL tests
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      # Starts Supabase's Postgres and applies supabase/migrations + seed.sql.
      - run: supabase db start
      - run: supabase/tests/run.sh
